<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Goblin Grimoire">
  <title>$GODOT_PROJECT_NAME</title>
  <link rel="icon" href="index.icon.png">
  <link rel="apple-touch-icon" href="index.apple-touch-icon.png">
  $GODOT_HEAD_INCLUDE
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101c1b; }
    body { color: #e4dbbe; font-family: system-ui, sans-serif; overscroll-behavior: none; }
    #game {
      position: fixed;
      left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
      top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
      height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #status {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 16px; padding: 24px;
      background: #161c19; text-align: center;
    }
    #status h1 { color: #b3ce78; font-size: 24px; margin: 0; }
    #status p { max-width: 32em; line-height: 1.5; margin: 0; }
    #progress { width: min(280px, 80%); accent-color: #b3ce78; }
    #notice { white-space: pre-line; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="canvas" tabindex="0" aria-label="Goblin Grimoire dungeon defense game">
      Your browser needs canvas and WebGL 2 to play Goblin Grimoire.
    </canvas>
    <section id="status" role="status" aria-live="polite">
      <h1>GOBLIN GRIMOIRE</h1>
      <p id="notice">Opening the dungeon… The first visit downloads the game.</p>
      <progress id="progress" aria-label="Loading game"></progress>
    </section>
  </main>
  <noscript>Enable JavaScript to play Goblin Grimoire.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const game = document.getElementById('game');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const notice = document.getElementById('notice');

    // The container follows Safari's visible viewport and excludes device cutouts.
    // Godot receives device pixels; the UI uses the display scale for CSS-size controls.
    function sizeCanvas() {
      const bounds = game.getBoundingClientRect();
      const density = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(bounds.width * density));
      const height = Math.max(1, Math.round(bounds.height * density));
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
    }
    sizeCanvas();
    new ResizeObserver(sizeCanvas).observe(game);
    window.addEventListener('resize', sizeCanvas);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', sizeCanvas);

    const engine = new Engine($GODOT_CONFIG);
    const missing = Engine.getMissingFeatures({ threads: false });
    function showFailure(error) {
      console.error(error);
      progress.hidden = true;
      notice.textContent = 'The dungeon could not open. ' +
        (error instanceof Error ? error.message : String(error)) +
        '\nTry reloading in an up-to-date Safari or another WebGL 2 browser.';
    }
    if (missing.length) {
      showFailure('Missing browser support: ' + missing.join(', '));
    } else {
      engine.startGame({
        canvas: canvas,
        canvasResizePolicy: 0,
        onProgress: function (current, total) {
          if (total > 0) { progress.max = total; progress.value = current; }
          else { progress.removeAttribute('value'); }
        }
      }).then(function () { status.remove(); }, showFailure);
    }
  </script>
</body>
</html>
