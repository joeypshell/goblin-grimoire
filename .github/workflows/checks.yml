name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7
        run: |
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
      - name: Import and parse project
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Verify gameplay and persistence
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_runner.gd
      - name: Verify continuous music, fades and browser gesture gate
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/test_music_director.gd
      - name: Verify music settings and mobile audio controls
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/audio_ui_smoke.gd
      - name: Verify phone layouts and UI actions
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/mobile_smoke.gd
      - name: Verify visible turn flow and safe playback
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/flow_smoke.gd
      - name: Verify illustrated cards and cosmetic motion
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/art_smoke.gd
      - name: Verify dungeon trait choices and champion UI
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/trait_smoke.gd
      - name: Verify spell rewards, saved traders and phone equipment controls
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/loot_smoke.gd
      - name: Verify party choices and phone preparation
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/party_routes_smoke.gd
      - name: Verify fast combat and saved playback preference
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/pacing_smoke.gd
      - name: Verify skill receipts and transformation rewards
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/reward_tactics_smoke.gd
      - name: Verify Marshal counterplay and form combo layouts
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/tactical_ui_smoke.gd
      - name: Verify early build rewards and encounter puzzles
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/slice_ui_smoke.gd
      - name: Play bounded first-act campaigns with actual rewards
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/first_act_playtest.gd
      - name: Verify automatic report uploads and retries
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/report_upload_smoke.gd
      - name: Verify phone report controls
        run: /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/report_ui_smoke.gd
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify report ingestion validation
        run: node tools/test_report_ingest.mjs
      - name: Cache web export templates
        if: github.event_name == 'push'
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.stable
          key: godot-4.7-web-templates
      - name: Install matching web templates
        if: github.event_name == 'push' && steps.templates.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -j /tmp/templates.tpz 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' 'templates/version.txt' -d ~/.local/share/godot/export_templates/4.7.stable
      - name: Export browser build
        if: github.event_name == 'push'
        run: |
          mkdir -p build/web
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          cp -r web/dashboard build/web/dashboard
      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Upload browser build
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    if: github.event_name == 'push'
    needs: headless
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
